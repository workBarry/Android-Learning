<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Android Learning · 精簡通訊範例</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf0f4;font:15px system-ui,-apple-system,"Segoe UI",sans-serif;color:#182838}.app{max-width:480px;height:100dvh;margin:auto;display:flex;flex-direction:column;background:white;position:relative}.bar{height:58px;flex-shrink:0;display:flex;align-items:center;gap:14px;border-bottom:1px solid #e5e8ec;padding:0 16px;background:#fff}button{border:0;background:none;color:#17685e;font:inherit;padding:8px 0;cursor:pointer}button:disabled{opacity:.3;cursor:default}.bar span{margin-left:auto;font-weight:600}.bar small{font-weight:400;color:#8c969f;font-size:11px;margin-right:6px}#pages{flex:1;min-height:0;position:relative}iframe{height:100%;width:100%;border:0;display:block}iframe[hidden]{display:none}.preview-note{font-size:11px;line-height:1.5;color:#7c8791;text-align:center;padding:7px 12px;border-top:1px solid #edf0f2}#toast{position:absolute;bottom:76px;left:30px;right:30px;padding:12px 16px;background:#273641;color:white;border-radius:8px;text-align:center;box-shadow:0 3px 12px #0002;word-break:break-word}
  </style>
</head>
<body>
  <main class="app">
    <nav class="bar"><button id="back" data-testid="native-back" aria-label="返回">‹ 返回</button><span><small>目前</small><b id="current-page" data-testid="current-page">新版網頁</b></span></nav>
    <section id="pages"></section>
    <div id="toast" role="status" data-testid="preview-toast" hidden></div>
    <footer class="preview-note">瀏覽器模擬 · Chrome 外開與原生提示請在 Android 驗證</footer>
  </main>
  <script type="module" src="/assets/web/preview-host.mjs"></script>
</body>
</html>
